<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Browser mockup representing the Dry Cleaning Management System">
  <defs>
    <linearGradient id="p1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c36"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="p1accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="520" fill="url(#p1bg)"/>

  <!-- Browser window -->
  <rect x="70" y="60" width="660" height="400" rx="14" fill="#101a31" stroke="#27365c" stroke-width="2"/>

  <!-- Browser top bar -->
  <rect x="70" y="60" width="660" height="50" rx="14" fill="#182442"/>
  <rect x="70" y="96" width="660" height="14" fill="#182442"/>

  <!-- Traffic lights + address bar -->
  <circle cx="102" cy="85" r="7" fill="#ef4444"/>
  <circle cx="126" cy="85" r="7" fill="#eab308"/>
  <circle cx="150" cy="85" r="7" fill="#22c55e"/>
  <rect x="180" y="72" width="430" height="26" rx="13" fill="#0d1526"/>
  <text x="395" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#64748b">dryclean-app.local</text>

  <!-- Page hero band -->
  <rect x="100" y="132" width="600" height="86" rx="10" fill="url(#p1accent)" opacity="0.9"/>
  <rect x="124" y="156" width="240" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
  <rect x="124" y="182" width="160" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="560" y="158" width="116" height="34" rx="8" fill="#0b1120" opacity="0.55"/>

  <!-- Content cards -->
  <g fill="#1b2848">
    <rect x="100" y="240" width="184" height="120" rx="10"/>
    <rect x="308" y="240" width="184" height="120" rx="10"/>
    <rect x="516" y="240" width="184" height="120" rx="10"/>
  </g>
  <g fill="#6366f1" opacity="0.75">
    <circle cx="140" cy="280" r="16"/>
    <circle cx="348" cy="280" r="16"/>
    <circle cx="556" cy="280" r="16"/>
  </g>
  <g fill="#32446f">
    <rect x="118" y="310" width="130" height="9" rx="4.5"/>
    <rect x="118" y="330" width="96" height="9" rx="4.5"/>
    <rect x="326" y="310" width="130" height="9" rx="4.5"/>
    <rect x="326" y="330" width="96" height="9" rx="4.5"/>
    <rect x="534" y="310" width="130" height="9" rx="4.5"/>
    <rect x="534" y="330" width="96" height="9" rx="4.5"/>
  </g>

  <!-- Table skeleton (bookings) -->
  <rect x="100" y="382" width="600" height="12" rx="6" fill="#22305a"/>
  <rect x="100" y="406" width="480" height="12" rx="6" fill="#22305a" opacity="0.6"/>
  <rect x="100" y="430" width="540" height="12" rx="6" fill="#22305a" opacity="0.4"/>

  <!-- Caption -->
  <text x="400" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3" fill="#8fa0c4">DRY CLEANING MANAGEMENT SYSTEM</text>
</svg>
